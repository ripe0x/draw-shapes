# Per-change checks. `changes` reads the changed paths, every other job runs only when its paths
# changed, and `ci-ok` always reports: it is the one status check to require, and it passes when
# every job succeeded or was skipped. A push to main, the nightly schedule and a manual dispatch run
# everything regardless of paths.
#
# The forge suites run as parallel shards that share one build cache. Each shard restores
# out/ and cache/ keyed on the Solidity sources, so a warm run compiles nothing. The fork shards also
# restore the RPC cache keyed on FORK_BLOCK, so a warm run reaches the gateway for nothing.
name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # nightly full run, 07:41 UTC
    - cron: "41 7 * * *"
  workflow_dispatch:

# An agent that pushes three times in two minutes pays for one run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORK_BLOCK: "26170000"
  MAINNET_RPC_URL: https://gateway.tenderly.co/public/mainnet

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The filter step runs only on pull requests. On push, schedule and dispatch it is skipped,
      # its outputs are empty, and `|| 'true'` turns every job on.
      contracts: ${{ steps.filter.outputs.contracts || 'true' }}
      web: ${{ steps.filter.outputs.web || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Every list names the workflow file, so a pipeline change runs everything.
          filters: |
            contracts:
              - 'src/**'
              - 'test/**'
              - 'lib/**'
              - 'script/**'
              - 'foundry.toml'
              - '.gitmodules'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - '.github/workflows/test.yml'

  contracts:
    name: contracts (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    # Cold against the public gateway (the RPC cache is evicted after seven unused days) a fork shard
    # can take many times its warm duration; the nightly run keeps the caches warm.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test-only contracts (PoolHarness) exceed EIP-170 by design; size-check the deployed set only.
          - shard: unit
            run: |
              forge build --sizes --skip test
              forge test --match-path "test/unit/*.t.sol"
          - shard: invariant
            run: forge test --match-path "test/invariant/*.t.sol" --match-test test_handlerReachesEveryPath
          - shard: scenario
            run: forge test --match-path test/scenario/PlayMonth.t.sol --match-test "test_play100PerDay|test_playPullPastHourEnd"
          # The fork suite is split in two by file. fork-b is the complement of fork-a's list, so a
          # new fork test file always lands in a shard.
          - shard: fork-a
            run: |
              forge test --match-path "test/fork/{Lens,PoolAcquire,PoolAdmin,PoolAdmission,PoolBoard,PoolDepth}.t.sol"
          - shard: fork-b
            run: |
              forge test --match-path "test/fork/*.t.sol" --no-match-path "test/fork/{Lens,PoolAcquire,PoolAdmin,PoolAdmission,PoolBoard,PoolDepth}.t.sol"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          # The action's own RPC cache is off: the per-shard cache below is the one keying scheme.
          cache: false
      # Compiled artifacts, keyed on everything solc reads and on the shard: `forge test` with a path
      # filter compiles only the matching test files, so each shard's artifacts differ and a cache
      # shared across shards holds only the first saver's. A hit turns the build into a no-op; a
      # partial hit through restore-keys (same shard first, then any shard) makes it incremental.
      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-build-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            forge-build-${{ runner.os }}-${{ matrix.shard }}-
            forge-build-${{ runner.os }}-
      # The fork tests read mainnet state at the pinned block. The RPC cache is keyed on the block and
      # the shard: shards fetch different slots, and only the first save under a key wins, so one key
      # for all shards would persist one shard's slots and leave the others cold forever. The nightly
      # run keeps every entry inside GitHub's seven-day eviction window.
      - uses: actions/cache/restore@v4
        id: rpc-cache
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ env.FORK_BLOCK }}-${{ matrix.shard }}
          # A shard without its own entry yet seeds from any other shard's at the same block.
          restore-keys: |
            foundry-rpc-${{ env.FORK_BLOCK }}-
      - name: ${{ matrix.shard }}
        run: ${{ matrix.run }}
      # The default cache action saves only when the job succeeds, so a shard that times out cold
      # against the gateway would stay cold on every later run. Save whatever was fetched, every time.
      - name: Save Foundry fork RPC cache
        if: always() && steps.rpc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ env.FORK_BLOCK }}-${{ matrix.shard }}

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # The one check to require on main. Passes when every job succeeded or was skipped; a cancelled or
  # failed job, including the `changes` job itself, fails it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, contracts, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.contracts.result }} ${{ needs.web.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "a job ended $r"; exit 1 ;;
            esac
          done
          echo "all jobs succeeded or were skipped"
