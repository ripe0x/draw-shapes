[profile.default]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "shapes/=lib/shapes/src/",
    "ladder/=lib/shapes/ladders/mainnet/",
    "@openzeppelin/contracts/=lib/shapes/lib/openzeppelin-contracts/contracts/",
    "draw-packs/=lib/draw-packs/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/src/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
]
auto_detect_remappings = false
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Every contract in src/ uses the legacy pipeline (BUILD_PROMPT rule 3). Only lib/draw-packs, which fork
# tests deploy as the two-unit Draw Packs variant, is compiled with via_ir, as in its own repository.
via_ir = false
additional_compiler_profiles = [{ name = "via-ir", via_ir = true, optimizer_runs = 200 }]
compilation_restrictions = [
    { paths = "lib/draw-packs/src/**", via_ir = true },
]
bytecode_hash = "none"
cbor_metadata = false
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./script/env" }, { access = "read-write", path = "./docs/receipts" }]
# Fork suites read MAINNET_RPC_URL (default: Tenderly public gateway) and FORK_BLOCK from the
# environment in test/fork/ForkBase.sol. Pin FORK_BLOCK so ~/.foundry/cache/rpc compounds.
no_storage_caching = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 40
fail_on_revert = false

[profile.ci.invariant]
runs = 64
depth = 64

# Sepolia build: the testnet ladder (unit 0.0001 ETH). Every other setting inherits from default.
[profile.sepolia]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "shapes/=lib/shapes/src/",
    "ladder/=lib/shapes/ladders/testnet/",
    "@openzeppelin/contracts/=lib/shapes/lib/openzeppelin-contracts/contracts/",
    "draw-packs/=lib/draw-packs/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/src/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false
