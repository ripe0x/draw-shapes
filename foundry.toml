[profile.default]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "shapes/=lib/shapes/src/",
    "ladder/=lib/shapes/ladders/mainnet/",
    "@openzeppelin/contracts/=lib/shapes/lib/openzeppelin-contracts/contracts/",
    "draw-packs/=lib/draw-packs/src/",
]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# lib/draw-packs compiles only with via_ir (stack too deep otherwise). Scoped profile, Pool stays legacy.
additional_compiler_profiles = [{ name = "draw-packs-ir", via_ir = true, optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "lib/draw-packs/src/**", via_ir = true }]
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./script/env" }]
# Fork suites read MAINNET_RPC_URL (default: Tenderly public gateway) and FORK_BLOCK from the
# environment in test/fork/ForkBase.sol. Pin FORK_BLOCK so ~/.foundry/cache/rpc compounds.
no_storage_caching = false
